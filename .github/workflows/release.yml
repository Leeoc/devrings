name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Only a newly pushed tag releases; the tag ruleset also stops existing v* tags being moved.
    if: github.event.created
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use the Command Line Tools
        run: sudo xcode-select --switch /Library/Developer/CommandLineTools
      - name: Test
        run: |
          # Newer Command Line Tools ship Swift Testing's interop library outside the framework rpath.
          interop=$(find /Library/Developer/CommandLineTools -name lib_TestingInterop.dylib 2>/dev/null | head -1)
          DYLD_LIBRARY_PATH=${interop:+$(dirname "$interop")} swift run DevRingsCoreTests
      - name: Build the release zip
        id: build
        run: |
          out=$(scripts/release.sh "$GITHUB_REF_NAME")
          echo "zip=$(echo "$out" | sed -n 1p)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(echo "$out" | sed -n 2p)" >> "$GITHUB_OUTPUT"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" --generate-notes \
            --notes "Install with \`brew trust --cask leeoc/tap/devrings && brew install --cask leeoc/tap/devrings\`. SHA-256: \`${{ steps.build.outputs.sha256 }}\`"
      - name: Bump the Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          version=${GITHUB_REF_NAME#v}
          key=$RUNNER_TEMP/tap_key
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:Leeoc/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -e "s/^  version \".*\"/  version \"$version\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" Casks/devrings.rb
          git diff --exit-code --quiet && { echo "Cask already at $version"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam ":arrow_up: devrings $version"
          git push -q
          rm -f "$key"
